name: Build Deploy Pack

# 云端构建：npm build 前端 → 生成精简部署包 → 作为 artifact 提供下载
# 目的：完全不依赖本地电脑，改完代码自动产出可上传的部署包
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 构建前端
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: 确认前端产物
        run: |
          test -f backend/app/webui/index.html || (echo "前端产物缺失" && exit 1)
          ls -la backend/app/webui | head -20

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 生成部署包
        run: python deploy_pack.py

      - name: 打包为 zip
        run: |
          cd ../rizhao-house-probe-deploy
          zip -r ../deploy-pack.zip . -x '*.pyc' -x '__pycache__/*'
          cd ..
          ls -lh deploy-pack.zip

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: rizhao-house-probe-deploy
          path: deploy-pack.zip
          retention-days: 30
