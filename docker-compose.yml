# ============================================================================
# 日照房价探针 · 捡漏雷达
# 用法：docker compose up -d --build   然后访问 http://127.0.0.1:8000
# ============================================================================
services:
  probe:
    build: .
    image: rizhao-house-probe:1.0.0
    container_name: rizhao-probe
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      RZ_DB_PATH: /app/data/rizhao.db
      TZ: Asia/Shanghai
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/meta/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
